<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="1; url=../">
    <link rel="canonical" href="../">
    <title>LP Counter</title>
</head>
<body>
    <p>La nuova interfaccia è ora disponibile nella pagina principale. <a href="../">Apri LP Counter</a>.</p>
    <script>
        (() => {
            const cookiePath = window.location.pathname.replace(/newui\/?$/, '') || '/';
            const secure = window.location.protocol === 'https:' ? '; Secure' : '';
            ['lp_newui_settings', 'lp_newui_consent'].forEach(name => {
                const cookie = document.cookie.split('; ').find(item => item.startsWith(name + '='));
                if (!cookie) return;
                document.cookie = cookie + '; Path=' + cookiePath + '; Max-Age=31536000; SameSite=Lax' + secure;
            });
            const redirect = () => window.location.replace('../');
            if (!('serviceWorker' in navigator)) {
                redirect();
                return;
            }

            navigator.serviceWorker.getRegistrations()
                .then(registrations => Promise.all(registrations
                    .filter(registration => new URL(registration.scope).pathname.endsWith('/newui/'))
                    .map(registration => registration.unregister())))
                .finally(redirect);
            window.setTimeout(redirect, 500);
        })();
    </script>
</body>
</html>
